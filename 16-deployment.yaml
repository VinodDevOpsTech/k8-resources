apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    project: roboshop
    environment: dev
    tier: frontend
    component: frontend
    purpose: deployment
spec:
  # modify replicas according to your case
  replicas: 10
  selector:
    matchLabels:
      project: roboshop
      environment: dev
      tier: frontend
      component: frontend
      purpose: deployment
  template:
    metadata:
      name: nginx
      labels:
        project: roboshop
        environment: dev
        tier: frontend
        component: frontend
        purpose: deployment
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  labels: 
    project: roboshop
    environment: dev
    tier: frontend
    component: frontend
    purpose: deployment
spec:
  selector:
    project: roboshop
    environment: dev
    tier: frontend
    component: frontend
    purpose: deployment
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80


