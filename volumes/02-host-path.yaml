apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-log-reader
spec:
  selector:
    matchLabels:
      app: node-log-reader

  template:
    metadata:
      labels:
        app: node-log-reader

    spec:
      containers:
      - name: nginx
        image: nginx:9
        volumeMounts:
        - name: node-logs
          mountPath: /host-logs
          readOnly: true
      - name: log-reader
        image: almalinux:9
        command: ["sleep", "3600"]
        volumeMounts:
        - name: node-logs
          mountPath: /host-logs
          readOnly: true
      volumes:
      - name: node-logs
        hostPath:
          path: /var/log
          type: Directory