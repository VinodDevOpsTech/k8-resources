apiVersion: v1
kind: Service
metadata:
  name: nginx
  labels: 
    project: roboshop
    environment: dev
spec:
  type: NodePort
  selector:
    project: roboshop
    tier: frontend
    component: frontend
  ports:
  - protocal: TCP
    port: 80
    targetPort: 80
---
apiVersion: v1
kind: Pod
metadata: 
  name: nginx
  labels:
    project: roboshop
    environment: dev
    tier: frontend
    component: frontend
spec:
  containers:
  - name: nginx
    image: nginx
